name: CI - Run Tests

on:
  pull_request:  
  push:           
    branches:
      - '**'      

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      # Common Configuration
      APPLICATION_NAME: DummyApp
      SERVER_PORT: 8080

      # Config Server Configuration
      GIT_URI: https://github.com/AbdelrahmanWalidHafez/UniHub-config.git
      GITHUB_USERNAME: ${{ secrets.U_NAME }}
      GITHUB_PASSWORD: ${{ secrets.TOKEN }}
      ENCRYPT_KEY: dummykey123
      # Ensure services and clients in this job use the local config server instance
      SPRING_CLOUD_CONFIG_URI: http://localhost:8080

      # Kafka Configuration
      KAFKA: kafka:9092

      # AWS S3 Configuration (dummy values for tests)
      ACCESS_KEY: test-access-key
      SECRET_KEY: test-secret-key
      REGION: us-east-1
      BUCKET_NAME: test-bucket      
      # JWT Configuration
      JWT_SECRET: test-jwt-secret-key-for-ci-only
      AUTH_HEADER: Authorization

      # API Key Configuration
      API_KEY: test-api-key-for-ci-only

      # Stripe Configuration (dummy values for tests)
      STRIPESK: sk_test_dummy_stripe_secret_key
      STRIPEPK: pk_test_dummy_stripe_public_key
      STRIPE_SUCCESS_URL: http://localhost:8080/success
      STRIPE_CANCEL_URL: http://localhost:8080/cancel
      # Redis for tests
      REDIS_HOST: localhost
      REDIS_PORT: 6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Java 21
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 21

      - name: Cache Maven packages
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build Config Server and run tests
        working-directory: config/config
        run: mvn -B clean verify

      - name: Package Config Server (create runnable jar)
        working-directory: config/config
        run: mvn -B -DskipTests package

      - name: Start Config Server locally and wait for healthy
        working-directory: config/config
        run: |
          set -e
          JAR=$(ls target/*.jar | head -n1)
          if [ -z "$JAR" ]; then
            echo "Config server jar not found in target/"; exit 1
          fi
          echo "Starting config server: $JAR"
          nohup java -jar "$JAR" --server.port=8080 > config-server.log 2>&1 &
          # wait for the config server to become healthy
          for i in {1..30}; do
            if curl -sS http://localhost:8080/actuator/health | grep -q UP; then
              echo "Config server is healthy"; break
            fi
            echo "Waiting for config server... ($i)"
            sleep 2
          done
          echo "Config server startup logs (first 200 lines):"
          sed -n '1,200p' config-server.log || true
      - name: Build Eureka Server
        working-directory: eureka/eureka
        run: mvn -B clean verify -DskipTests=true

      - name: Build Gateway
        working-directory: gateway/gateway
        run: mvn -B clean verify -DskipTests=true

      - name: Build Auth Microservice
        working-directory: auth/auth
        run: mvn -B clean verify -DskipTests=true

      - name: Build S3 Microservice
        working-directory: s3/s3
        run: mvn -B clean verify -DskipTests=true

      - name: Build Subscription Microservice
        working-directory: subscription/subscription
        run: mvn -B clean verify -DskipTests=true

      - name: Build University Management Microservice
        working-directory: universitymanagement/universitymanagement
        run: mvn -B clean verify -DskipTests=true
