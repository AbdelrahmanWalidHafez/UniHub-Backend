spring:
  application:
    name: ${APPLICATION_NAME}
  config:
    import: optional:configserver:http://config-server:8080
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
      client:
        config:
          default:
            connect-timeout: 4000
            read-timeout: 4000
    stream:
      bindings:
        uploadFile-out-0:
          destination: upload-file-topic
          content-type: application/json
        deleteFile-out-0:
          destination: delete-file-topic
          content-type: application/json
        setUniversitySubscriptionPlan-out-0:
          destination: set-plan-topic
          content-type: application/json
        upgradeUniversitySubscriptionPlan-out-0:
          destination: upgrade-plan-topic
          content-type: application/json
        sendAcceptanceMail-out-0:
          destination: send-email-acceptance-topic
          content-type: application/json
        sendRejectionMail-out-0:
          destination: send-email-rejection-topic
          content-type: application/json
      kafka:
        binder:
          brokers: ${KAFKA}
stripe:
  stripeSk: ${STRIPESK}
  stripePk: ${STRIPEPK}
  successUrl: ${STRIPE_SUCCESS_URL}
  cancelUrl: ${STRIPE_CANCEL_URL}
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 10
        permitted-number-of-calls-in-half-open-state: 2
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10000
