spring:
  application:
    name: ${APPLICATION_NAME}
  config:
    import: optional:configserver:http://config-server:8080
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
jwt:
  secret: ${JWT_SECRET}
  expirationTime: 3600000
  authorizationHeader: ${AUTH_HEADER}
  refreshToken:
    expirationTime: 259200000

api:
  key: ${API_KEY}
