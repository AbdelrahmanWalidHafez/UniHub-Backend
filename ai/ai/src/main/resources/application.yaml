spring:
  application:
    name: ${APPLICATION_NAME}
  config:
    import: optional:configserver:http://config-server:8080
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: always
            schema: classpath:/schema/schema.sql
api:
  key: ${API_KEY}
logging:
  level:
    org:
      springframework:
        ai:
          chat:
            client:
              advisor: DEBUG