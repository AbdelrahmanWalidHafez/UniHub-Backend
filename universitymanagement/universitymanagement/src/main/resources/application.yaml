spring:
  application:
    name: ${APPLICATION_NAME}
  config:
    import: optional:configserver:http://config-server:8080
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
    function:
      definition: setUniversitySubscriptionPlan
    stream:
      defaultBinder: kafka
      bindings:
        setUniversitySubscriptionPlan-in-0:
          destination: set-plan-topic
          content-type: application/json
          group: ${spring.application.name}
      kafka:
        binder:
          brokers: ${KAFKA}

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 10
        permitted-number-of-calls-in-half-open-state: 2
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10000
api:
  key: ${API_KEY}

