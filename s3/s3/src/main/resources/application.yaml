spring:
  application:
    name: ${APPLICATION_NAME}

  config:
    import: optional:configserver:http://config-server:8080

  cloud:
    function:
      definition: uploadFile;deleteFile
    stream:
      defaultBinder: kafka
      bindings:
        uploadFile-in-0:
          destination: upload-file-topic
          content-type: application/json
          group: ${spring.application.name}
        deleteFile-in-0:
          destination: delete-file-topic
          content-type: application/json
          group: ${spring.application.name}
      kafka:
        binder:
          brokers: ${KAFKA}
          configuration:
            fetch.max.bytes: 52428800
            max.partition.fetch.bytes: 52428800
aws:
  accessKey: ${ACCESS_KEY}
  secretKey: ${SECRET_KEY}
  region: ${REGION}
  bucketName: ${BUCKET_NAME}